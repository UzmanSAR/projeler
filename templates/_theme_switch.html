{% comment %}Görünüm seçimi. "Otomatik" telefonun ya da bilgisayarın ayarına uyar; seçim yalnızca bu cihazda saklanır (static/js/app.js).
Betik çalışmazsa düğmeler hiçbir şey yapamayacağı için gizli kalır; sayfa yine telefonun ayarına uyar.{% endcomment %}
<div class="theme-switch" role="group" aria-label="Görünüm" data-theme-switch hidden>
  {% if not bare %}<span class="theme-switch-label" aria-hidden="true">Görünüm</span>{% endif %}
  <button type="button" data-theme-set="auto" aria-pressed="true">Otomatik</button>
  <button type="button" data-theme-set="light" aria-pressed="false">Açık</button>
  <button type="button" data-theme-set="dark" aria-pressed="false">Koyu</button>
</div>
