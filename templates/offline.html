<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bağlantı yok · {{ SITE_NAME }}</title>
<meta name="theme-color" content="#f4f1ea">
<meta name="robots" content="noindex">
<style>
  html { background: #f4f1ea; color: #1b1915; -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 400 1rem/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 26rem; padding: 2rem 1.25rem; text-align: center; }
  svg { width: 3.5rem; height: auto; }
  h1 { font: 400 2rem/1.1 Georgia, "Times New Roman", serif; margin: 1.25rem 0 .5rem; }
  p { margin: 0 0 1.5rem; color: #5c564c; }
  button { font: 600 1rem system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 48px; padding: 0 1.5rem; color: #fdfbf6; background: #7b1e2b; border: 1px solid #7b1e2b; border-radius: 3px; cursor: pointer; }
  button:focus-visible { outline: 2px solid #a02536; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 64 120" aria-hidden="true" fill="none" stroke="#1b1915" stroke-width="3" stroke-linejoin="round"><circle cx="32" cy="10" r="7"/><rect x="18" y="20" width="28" height="8" fill="#1b1915"/><rect x="21" y="28" width="22" height="62" fill="#fdfbf6"/><path d="M21,44L43,30M21,62L43,48M21,80L43,66" stroke="#7b1e2b" stroke-width="6"/><rect x="21" y="28" width="22" height="62"/><rect x="18" y="90" width="28" height="8" fill="#1b1915"/><path d="M12,110H52M32,98V110"/></svg>
  <h1>Bağlantı yok</h1>
  <p>İnternet bağlantın kesilmiş görünüyor. Bağlantı gelince sayfa kendiliğinden yeniden açılır.</p>
  <button type="button" onclick="again()">Tekrar dene</button>
</main>
<script>
/* Bağlantı gelince sayfa kendiliğinden açılır: cihaz "çevrimiçi" dediğinde ve, cihaz hiç çevrimdışı
   olmadıysa (zayıf sinyal, sunucu yeniden başlıyor), birkaç saniyede bir sunucuya sorarak.
   Takvim dosyası (.ics) adresinde bir üst sayfaya dönülür: dosya indirilince bu sayfa yerinde kalırdı. */
function again() {
  if (/\.ics$/.test(location.pathname)) location.replace(location.pathname.replace(/[^\/]+$/, ''));
  else if (location.pathname === '{% url "offline" %}') location.replace('/');   /* bu sayfanın kendi adresi: ana sayfaya */
  else location.reload();
}
addEventListener('online', again);
setInterval(function () {
  if (document.visibilityState === 'visible') fetch('/sw.js', { method: 'HEAD', cache: 'no-store' }).then(function (r) { if (r.ok) again(); }, function () {});
}, 5000);
</script>
</body>
</html>
