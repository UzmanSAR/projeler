<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bağlantı yok · {{ SITE_NAME }}</title>
<meta name="theme-color" content="#d2d5d8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1e2125" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<script>try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
<style>
  /* Bu sayfa çevrimdışıyken önbellekten açılır; site stillerine ulaşamayabilir, renkleri kendinde taşır (açık ve koyu). */
  :root { --bg: #d2d5d8; --ink: #17191c; --muted: #4a4f5a; --accent: #17191c; --accent-bright: #2f3238; --on-accent: #ffffff; --hi: #ffffff; --lo: #9496b0; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #1e2125; --ink: #e9ebee; --muted: #a2a8b2; --accent: #eef0f2; --accent-bright: #ffffff; --on-accent: #141619; --hi: #2e3238; --lo: #111315; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #1e2125; --ink: #e9ebee; --muted: #a2a8b2; --accent: #eef0f2; --accent-bright: #ffffff; --on-accent: #141619; --hi: #2e3238; --lo: #111315; color-scheme: dark; }
  html { background: var(--bg); color: var(--ink); -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 400 1rem/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 26rem; padding: 2rem 1.25rem; text-align: center; }
  svg { width: 3rem; height: auto; }
  svg rect { fill: var(--accent); } svg path { stroke: var(--on-accent); } svg circle { fill: var(--on-accent); }
  h1 { font: 800 2.2rem/1.05 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; letter-spacing: -.03em; margin: 1.25rem 0 .5rem; }
  p { margin: 0 0 1.5rem; color: var(--muted); }
  button { font: 700 1rem system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 52px; padding: 0 1.8rem; color: var(--on-accent); background: var(--accent); border: 0; border-radius: 999px; cursor: pointer;
    box-shadow: -8px -8px 18px var(--hi), 8px 8px 18px var(--lo); }
  button:active { box-shadow: inset 4px 4px 10px var(--lo), inset -4px -4px 10px var(--hi); }
  svg { border-radius: 10px; box-shadow: -6px -6px 14px var(--hi), 6px 6px 14px var(--lo); }
  button:focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 2px; }
  .tt { position: fixed; top: calc(14px + env(safe-area-inset-top)); right: calc(14px + env(safe-area-inset-right)); width: 44px; height: 44px; min-height: 0; padding: 0;
    display: grid; place-items: center; color: var(--ink); background: var(--bg); }
  .tt svg { width: 20px; height: 20px; border-radius: 0; box-shadow: none; fill: currentColor; }
</style>
</head>
<body>
<button type="button" class="tt" aria-label="Koyu tema" aria-pressed="false" title="Koyu / açık tema" onclick="flip()"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.4 14.6A8.6 8.6 0 0 1 9.4 3.6a8.6 8.6 0 1 0 11 11z"/></svg></button>
<main>
  <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M22.4 12.2A7.6 7.6 0 1 0 23.6 16.4M16 11.6v4.6l3 1.9" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23.1" cy="9.4" r="1.5"/></svg>
  <h1>Bağlantı yok</h1>
  <p>İnternet bağlantın kesilmiş görünüyor. Bağlantı gelince sayfa kendiliğinden yeniden açılır.</p>
  <button type="button" onclick="again()">Tekrar dene</button>
</main>
<script>
/* Bağlantı gelince sayfa kendiliğinden açılır: cihaz "çevrimiçi" dediğinde ve, cihaz hiç çevrimdışı
   olmadıysa (zayıf sinyal, sunucu yeniden başlıyor), birkaç saniyede bir sunucuya sorarak.
   Takvim dosyası (.ics) adresinde bir üst sayfaya dönülür: dosya indirilince bu sayfa yerinde kalırdı. */
/* koyu / açık tema: sitenin geri kalanıyla aynı seçim (localStorage "theme") */
function isDark() { var t = document.documentElement.getAttribute('data-theme'); return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
function flip() {
  var t = isDark() ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', t);
  try { localStorage.setItem('theme', t); } catch (e) {}
  document.querySelector('.tt').setAttribute('aria-pressed', String(t === 'dark'));
}
document.querySelector('.tt').setAttribute('aria-pressed', String(isDark()));
function again() {
  if (/\.ics$/.test(location.pathname)) location.replace(location.pathname.replace(/[^\/]+$/, ''));
  else if (location.pathname === '{% url "offline" %}') location.replace('/');   /* bu sayfanın kendi adresi: ana sayfaya */
  else location.reload();
}
addEventListener('online', again);
setInterval(function () {
  if (document.visibilityState === 'visible') fetch('/sw.js', { method: 'HEAD', cache: 'no-store' }).then(function (r) { if (r.ok) again(); }, function () {});
}, 5000);
</script>
</body>
</html>
