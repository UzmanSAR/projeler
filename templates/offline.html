<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bağlantı yok · {{ SITE_NAME }}</title>
<meta name="theme-color" content="#f6f4f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121615" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="robots" content="noindex">
<script>try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}</script>
<style>
  /* Bu sayfa çevrimdışıyken önbellekten açılır; site stillerine ulaşamayabilir, renkleri kendinde taşır (açık ve koyu). */
  :root { --bg: #f6f4f0; --ink: #1c1d1f; --muted: #5b5852; --accent: #1e4b43; --accent-bright: #2a6359; --on-accent: #ffffff; color-scheme: light; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #121615; --ink: #ecebe6; --muted: #a8a59d; --accent: #80c3b1; --accent-bright: #9dd4c5; --on-accent: #0c1a16; color-scheme: dark; } }
  :root[data-theme="dark"] { --bg: #121615; --ink: #ecebe6; --muted: #a8a59d; --accent: #80c3b1; --accent-bright: #9dd4c5; --on-accent: #0c1a16; color-scheme: dark; }
  html { background: var(--bg); color: var(--ink); -webkit-text-size-adjust: 100%; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 400 1rem/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 26rem; padding: 2rem 1.25rem; text-align: center; }
  svg { width: 3rem; height: auto; }
  svg rect { fill: var(--accent); } svg path { stroke: var(--on-accent); } svg circle { fill: var(--on-accent); }
  h1 { font: 400 2rem/1.1 Georgia, "Times New Roman", serif; margin: 1.25rem 0 .5rem; }
  p { margin: 0 0 1.5rem; color: var(--muted); }
  button { font: 600 1rem system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; min-height: 48px; padding: 0 1.5rem; color: var(--on-accent); background: var(--accent); border: 1px solid var(--accent); border-radius: 8px; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--accent-bright); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8"/><path d="M22.4 12.2A7.6 7.6 0 1 0 23.6 16.4M16 11.6v4.6l3 1.9" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23.1" cy="9.4" r="1.5"/></svg>
  <h1>Bağlantı yok</h1>
  <p>İnternet bağlantın kesilmiş görünüyor. Bağlantı gelince sayfa kendiliğinden yeniden açılır.</p>
  <button type="button" onclick="again()">Tekrar dene</button>
</main>
<script>
/* Bağlantı gelince sayfa kendiliğinden açılır: cihaz "çevrimiçi" dediğinde ve, cihaz hiç çevrimdışı
   olmadıysa (zayıf sinyal, sunucu yeniden başlıyor), birkaç saniyede bir sunucuya sorarak.
   Takvim dosyası (.ics) adresinde bir üst sayfaya dönülür: dosya indirilince bu sayfa yerinde kalırdı. */
function again() {
  if (/\.ics$/.test(location.pathname)) location.replace(location.pathname.replace(/[^\/]+$/, ''));
  else if (location.pathname === '{% url "offline" %}') location.replace('/');   /* bu sayfanın kendi adresi: ana sayfaya */
  else location.reload();
}
addEventListener('online', again);
setInterval(function () {
  if (document.visibilityState === 'visible') fetch('/sw.js', { method: 'HEAD', cache: 'no-store' }).then(function (r) { if (r.ok) again(); }, function () {});
}, 5000);
</script>
</body>
</html>
