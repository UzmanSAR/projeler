# Render üzerinde tek tıkla kurulum (web servisi + PostgreSQL).
# Bu bir tanıtım kurulumudur: gerçek SMS gitmez, doğrulama kodu ekranda gösterilir.
databases:
  - name: berber-db
    plan: free
    region: frankfurt
    databaseName: berber
    user: berber

services:
  - type: web
    name: berber-randevu
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: ./build.sh
    # Tek süreç: kod gönderim sınırları süreç belleğinde sayılır (REDIS_URL verilene kadar).
    startCommand: gunicorn config.wsgi:application --workers 1 --threads 4
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: berber-db
          property: connectionString
      - key: SMS_SHOW_CODE
        value: "1"
      - key: SEED_DEMO
        value: "1"
