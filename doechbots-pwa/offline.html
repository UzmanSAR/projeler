<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f1115">
  <title>Bağlantı yok · DoechBots</title>
  <style>
    :root { color-scheme: dark light; --bg: #0f1115; --fg: #eef0f4; --muted: #9aa1ad; --accent: #f5b83d; }
    @media (prefers-color-scheme: light) { :root { --bg: #f6f7f9; --fg: #14161b; --muted: #5b6270; --accent: #b37800; } }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; min-height: 100dvh; display: grid; place-items: center;
      background: var(--bg); color: var(--fg); padding: 24px 16px;
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; text-align: center; }
    main { max-width: 22rem; }
    img { width: 72px; height: 72px; border-radius: 18px; }
    h1 { font-size: 1.35rem; margin: 20px 0 8px; }
    p { margin: 0 0 24px; color: var(--muted); }
    button { font: inherit; font-weight: 600; border: 0; border-radius: 12px; padding: 12px 24px;
      background: var(--accent); color: #14161b; cursor: pointer; min-height: 48px; }
  </style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>İnternet bağlantısı yok</h1>
    <p>Panel bot durumunu canlı gösterdiği için bağlantı gerekiyor. Bağlantı gelince sayfa kendiliğinden yenilenir.</p>
    <button type="button" onclick="location.reload()">Tekrar dene</button>
  </main>
  <script>window.addEventListener('online', function () { location.reload(); });</script>
</body>
</html>
